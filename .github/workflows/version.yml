name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.0)
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit, tag, and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be a plain semantic version, got: $RELEASE_VERSION"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag $RELEASE_VERSION already exists."
            exit 1
          fi

          current_version="$(awk -F'"' '/^uripainter = / { print $2; exit }' gradle/libs.versions.toml)"
          if [ -z "$current_version" ]; then
            echo "Could not determine the current release version."
            exit 1
          fi

          sed -i "s/^uripainter = \"$current_version\"/uripainter = \"$RELEASE_VERSION\"/" gradle/libs.versions.toml
          sed -i -E "s/(com\\.composables:compose-uri-painter:)[0-9]+\\.[0-9]+\\.[0-9]+/\\1$RELEASE_VERSION/" README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml README.md
          git commit -m "Release Compose Uri Painter $RELEASE_VERSION"
          git tag "$RELEASE_VERSION"
          git push origin HEAD:main "$RELEASE_VERSION"

          gh workflow run release.yml --ref "$RELEASE_VERSION" -f tag="$RELEASE_VERSION"
