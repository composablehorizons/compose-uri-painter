name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  release:
    uses: composablehorizons/.github/.github/workflows/library-release.yml@main
    with:
      bump: ${{ inputs.bump }}
      package-directory: library
      test-command: :library:jvmTest
      android-packages: 'platforms;android-36 build-tools;35.0.0'
    permissions:
      contents: write
    secrets: inherit
